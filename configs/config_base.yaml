# RHYME Configuration File

# Model Architecture
model:
  input_dim: 1024
  hidden_dim: 512
  dropout: 0.3
  use_hyperbolic: true
  use_spherical: true

# Training Parameters
training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  weight_decay: 1e-5
  gradient_clip: 1.0

# Scheduler
scheduler:
  type: ReduceLROnPlateau
  factor: 0.5
  patience: 5
  min_lr: 1e-6

# Data Configuration
data:
  train_dir: data/train
  val_dir: data/val
  test_dir: data/test
  sr: 16000
  duration: 3.0

# Device
device: cuda
seed: 42
num_workers: 4

# Logging
logging:
  interval: 10
  tensorboard: true
  log_dir: results/logs

# Checkpointing
checkpointing:
  save_interval: 5
  keep_best: true
  save_dir: models/checkpoints
